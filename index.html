<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Capo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="src/game.css">
</head>
<body>
  <main class="game">
    <div class="view" id="view"></div>

    <div class="start" id="start">
      <p class="start-title">Capo</p>
      <p class="start-sub">Tocá para empezar</p>
      <p class="start-hint" id="startHint">Sacudí el celular para saltar</p>
    </div>

    <!-- El estado y la sacudida siguen vivos para el motor, pero no se muestran en esta iteración -->
    <span class="sr-only" id="state" aria-live="polite">cargando</span>
    <button id="shakeBtn" hidden>sacudir: off</button>

    <div class="controls">
      <div class="cross" role="group" aria-label="Dirección">
        <button id="bU" class="arm up" aria-label="Saltar"></button>
        <button id="bL" class="arm left" aria-label="Izquierda"></button>
        <span class="arm mid" aria-hidden="true"></span>
        <button id="bR" class="arm right" aria-label="Derecha"></button>
        <span class="arm down" aria-hidden="true"></span>
      </div>
      <div class="ab">
        <button id="bD" class="round b" aria-label="Bailar"></button>
        <button id="bJ" class="round a" aria-label="Saltar"></button>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script src="src/config.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/vigilia.js"></script>
  <script src="src/controls.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
