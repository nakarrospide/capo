<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Capo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="src/game.css?v=202610210116">
</head>
<body>
  <main class="game" id="game" data-ui="tinta">
    <div class="view" id="view"></div>

    <!-- UI 1: botones de vidrio sobre la obra -->
    <div class="pad" id="pad">
      <div class="cross" id="cross" role="group" aria-label="Dirección: izquierda, derecha, arriba salta">
        <div class="cross-glass" id="crossGlass">
          <span class="arm up"></span><span class="arm left"></span><span class="arm right"></span><span class="arm down"></span>
        </div>
        <svg class="cross-line" viewBox="0 0 132 132" aria-hidden="true">
          <path d="M44 1.5H88V44H130.5V88H88V130.5H44V88H1.5V44H44Z" />
        </svg>
      </div>
      <div class="ab">
        <button id="bD" class="round b" aria-label="Bailar"></button>
        <button id="bJ" class="round a" aria-label="Saltar"></button>
      </div>
    </div>

    <!-- UI 2 (la principal): stick que aparece donde apoyás a la izquierda, saltar y bailar a la derecha -->
    <div class="zones" id="zones">
      <div class="stick" id="stick" aria-hidden="true"><span class="knob" id="knob"></span></div>
    </div>
    <div class="zbtns">
      <button class="round dance" id="zD" aria-label="Bailar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="16.5" cy="16" r="2.5" /></svg>
      </button>
      <button class="round jump" id="zJ" aria-label="Saltar">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 14l6-6 6 6" /></svg>
      </button>
    </div>

    <!-- UI 3 (la principal): pantalla limpia, trazos de tinta solo donde tocás -->
    <div class="inkzone" id="inkzone"></div>

    <div class="start" id="start">
      <h1 class="start-title"><img src="assets/capo/logo.png" alt="Capo" width="1200" height="883"></h1>
      <p class="start-sub">Tocá para empezar</p>
      <p class="start-hint" id="uiHint"></p>
      <p class="start-hint" id="startHint">Sacudí el celular para saltar</p>
    </div>

    <!-- Contador de gotas y carteles escritos a mano: aparecen un momento y se van -->
    <div class="hud" id="hud" aria-live="polite"><img src="assets/capo/gota.svg" alt="" width="14" height="17"><span id="hudN">0</span></div>
    <div class="card" id="card" aria-live="polite"><p class="card-name" id="cardName"></p><p class="card-sub" id="cardSub"></p></div>

    <span class="sr-only" id="state" aria-live="polite">cargando</span>
    <button id="shakeBtn" hidden>sacudir: off</button>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script src="src/config.js?v=202610210116"></script>
  <script src="src/engine.js?v=202610210116"></script>
  <script src="src/piezas.js?v=202610210116"></script>
  <script src="src/niveles.js?v=202610210116"></script>
  <script src="src/controls.js?v=202610210116"></script>
  <script src="src/game.js?v=202610210116"></script>
</body>
</html>
