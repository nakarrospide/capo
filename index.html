<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Capo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="src/game.css">
</head>
<body>
  <main class="game" id="game" data-ui="botones">
    <div class="view" id="view"></div>

    <!-- UI 1: botones de vidrio sobre la obra -->
    <div class="pad" id="pad">
      <div class="cross" id="cross" role="group" aria-label="Dirección: izquierda, derecha, arriba salta">
        <div class="cross-glass" id="crossGlass">
          <span class="arm up"></span><span class="arm left"></span><span class="arm right"></span><span class="arm down"></span>
        </div>
        <svg class="cross-line" viewBox="0 0 132 132" aria-hidden="true">
          <path d="M44 1.5H88V44H130.5V88H88V130.5H44V88H1.5V44H44Z" />
        </svg>
      </div>
      <div class="ab">
        <button id="bD" class="round b" aria-label="Bailar"></button>
        <button id="bJ" class="round a" aria-label="Saltar"></button>
      </div>
    </div>

    <!-- UI 2: sin botones. Izquierda arrastrás para caminar, derecha tocás para saltar -->
    <div class="zones" id="zones">
      <div class="stick" id="stick" aria-hidden="true"><span class="knob" id="knob"></span></div>
    </div>
    <button class="round small dance-ghost" id="zD" aria-label="Bailar"></button>

    <button class="ui-swap" id="uiSwap" aria-label="Cambiar controles">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3" /></svg>
    </button>

    <div class="start" id="start">
      <p class="start-title">Capo</p>
      <p class="start-sub">Tocá para empezar</p>
      <p class="start-hint" id="uiHint"></p>
      <p class="start-hint" id="startHint">Sacudí el celular para saltar</p>
    </div>

    <span class="sr-only" id="state" aria-live="polite">cargando</span>
    <button id="shakeBtn" hidden>sacudir: off</button>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script src="src/config.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/vigilia.js"></script>
  <script src="src/controls.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
